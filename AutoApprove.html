<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoApprove Demo</title>
    <style>
        :root {
            --primary: #4f46e5; --bg: #f8fafc; --sidebar: #1e293b;
            --text: #334155; --white: #ffffff; --border: #e2e8f0;
            --success: #22c55e; --danger: #ef4444; --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; }

        /* Navigation Bar (Top Left) */
        .back-nav { 
            position: fixed; top: 0; left: 0; width: 100%; height: 60px; 
            background: var(--white); display: flex; align-items: center; 
            padding: 0 20px; border-bottom: 1px solid var(--border); z-index: 100;
        }
        .back-btn { 
            text-decoration: none; color: var(--sidebar); font-weight: 600; 
            display: flex; align-items: center; gap: 8px; font-size: 14px;
        }

        /* Layout */
        .app-container { display: flex; width: 100%; margin-top: 60px; }
        .sidebar { width: 240px; background: var(--sidebar); color: #94a3b8; padding: 20px; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }

        /* Components */
        .card { background: var(--white); border-radius: 12px; padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { padding: 20px; border-radius: 10px; background: var(--white); border: 1px solid var(--border); }
        .stat-val { font-size: 24px; font-weight: bold; color: var(--primary); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid var(--border); color: #64748b; }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .b-pending { background: #fef3c7; color: #92400e; }
        .b-approved { background: #dcfce7; color: #166534; }
        .b-rejected { background: #fee2e2; color: #991b1b; }

        button { cursor: pointer; padding: 8px 16px; border-radius: 6px; border: none; font-weight: 600; }
        .btn-pri { background: var(--primary); color: white; }
        .btn-sm { padding: 4px 8px; font-size: 12px; }
        
        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal.open { display: flex; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 400px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid var(--border); border-radius: 6px; }
    </style>
</head>
<body>

    <!-- Nav Bar -->
    <nav class="back-nav">
        <a href="why_portofolio.html" class="back-btn">← Kembali ke Halaman Utama</a>
    </nav>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2 style="color:white; margin-bottom: 30px;">AutoApprove</h2>
            <p style="margin-bottom: 10px;">Menu</p>
            <ul style="list-style: none;">
                <li style="padding: 10px; background: rgba(255,255,255,0.1); border-radius: 6px; cursor: pointer;">Dashboard</li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div style="display:flex; justify-content: space-between; align-items: center;">
                <h1>Workflows</h1>
                <button class="btn-pri" onclick="toggleModal(true)">+ Buat Permintaan</button>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card"><div>Total Pending</div><div class="stat-val" id="cnt-pending">0</div></div>
                <div class="stat-card"><div>Approved</div><div class="stat-val" id="cnt-approved">0</div></div>
                <div class="stat-card"><div>Rejected</div><div class="stat-val" id="cnt-rejected">0</div></div>
            </div>

            <!-- Table -->
            <div class="card">
                <table>
                    <thead>
                        <tr><th>ID</th><th>User</th><th>Tipe</th><th>Status</th><th>Aksi</th></tr>
                    </thead>
                    <tbody id="requestTable"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Form -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3>Buat Permintaan Baru</h3>
            <input type="text" id="reqUser" placeholder="Nama Karyawan">
            <select id="reqType">
                <option>Cuti</option>
                <option>Reimbursement</option>
                <option>Pembelian Barang</option>
            </select>
            <div style="display:flex; gap: 10px; margin-top: 15px;">
                <button onclick="toggleModal(false)" style="flex:1;">Batal</button>
                <button onclick="addRequest()" class="btn-pri" style="flex:1;">Submit</button>
            </div>
        </div>
    </div>

    <script>
        // In-memory state
        let requests = [
            { id: 'REQ-001', user: 'Budi Santoso', type: 'Cuti', status: 'pending' },
            { id: 'REQ-002', user: 'Siti Aminah', type: 'Reimbursement', status: 'approved' }
        ];

        function render() {
            const tbody = document.getElementById('requestTable');
            tbody.innerHTML = '';
            
            let p = 0, a = 0, r = 0;

            requests.forEach(req => {
                if(req.status === 'pending') p++;
                if(req.status === 'approved') a++;
                if(req.status === 'rejected') r++;

                const row = `<tr>
                    <td>${req.id}</td>
                    <td>${req.user}</td>
                    <td>${req.type}</td>
                    <td><span class="badge b-${req.status}">${req.status.toUpperCase()}</span></td>
                    <td>
                        ${req.status === 'pending' ? 
                            `<button class="btn-sm btn-pri" onclick="updateStatus('${req.id}', 'approved')">Approve</button>
                             <button class="btn-sm" style="background:#eee" onclick="updateStatus('${req.id}', 'rejected')">Reject</button>` 
                            : '-'
                        }
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            });

            document.getElementById('cnt-pending').innerText = p;
            document.getElementById('cnt-approved').innerText = a;
            document.getElementById('cnt-rejected').innerText = r;
        }

        function updateStatus(id, status) {
            const req = requests.find(r => r.id === id);
            if(req) req.status = status;
            render();
        }

        function toggleModal(show) {
            document.getElementById('modal').classList.toggle('open', show);
        }

        function addRequest() {
            const user = document.getElementById('reqUser').value;
            const type = document.getElementById('reqType').value;
            if(!user) return alert('Nama harus diisi');
            
            requests.push({
                id: 'REQ-' + Math.floor(Math.random()*999),
                user: user,
                type: type,
                status: 'pending'
            });
            
            toggleModal(false);
            render();
            document.getElementById('reqUser').value = '';
        }

        render();
    </script>
</body>
</html>
