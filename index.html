<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="twitter:description" content="SAP Web Development and smart technology solutions for modern business.">
    <meta name="twitter:image" content="https://synexa-sap-system.netlify.app/logo.png">

    <!-- Organization structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SYNEXA",
      "url": "https://synexa-sap-system.netlify.app/",
      "logo": "https://synexa-sap-system.netlify.app/logo.png",
      "description": "SAP Web Development and smart technology solutions for modern business."
    }
    </script>
    <style>
        /* === RESET & BASE STYLES === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* Background elegan dan modern (Light Minimalist Enterprise) */
            background: radial-gradient(circle at center, #ffffff 0%, #e2e8f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1e293b;
        }

        /* === BACKGROUND LAYER (PARTICLES) === */
        #networkCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: auto; /* Memastikan interaksi mouse tetap berjalan */
            touch-action: none;
        }

        /* === MAIN CONTENT === */
        .content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        /* Logo diperbesar */
        .logo-img {
            width: 500px;
            max-width: 85vw;
            height: auto;
            /* Animasi Logo */
            opacity: 0;
            transform: scale(0.95);
            animation: zoomFadeIn 1s ease-out forwards;
        }

        /* Akronim diletakkan sebagai tag rapi di bawah logo */
        .acronym-tag {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: #334155;
            margin-top: 15px;
            margin-bottom: 30px;
            opacity: 0;
            animation: slideUpFade 1s ease-out forwards;
            animation-delay: 0.4s;
        }

        .acronym-tag span.dot {
            color: #0ea5e9;
            font-weight: bold;
        }

        .tagline {
            font-size: 1.25rem;
            font-weight: 400;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 600px;
            opacity: 0;
            animation: slideUpFade 1s ease-out forwards;
            animation-delay: 0.6s;
        }

        /* HIGHLIGHT SCRIPT: TOMBOL ENTER SEBAGAI REFERENSI KE NEXT PAGE */
        .enter-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 1px;
            padding: 16px 40px;
            border-radius: 50px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.3);
            transition: all 0.3s ease;
            opacity: 0;
            animation: slideUpFade 1s ease-out forwards;
            animation-delay: 0.8s;
            position: relative;
            overflow: hidden;
        }

        .enter-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px -5px rgba(15, 23, 42, 0.4);
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }

        .enter-button:active {
            transform: translateY(1px);
            box-shadow: 0 5px 15px -5px rgba(15, 23, 42, 0.3);
        }

        /* === MEDIA QUERIES UNTUK SMARTPHONE === */
        @media (max-width: 600px) {
            .logo-img {
                width: 90vw;
            }
            .acronym-tag {
                font-size: 0.75rem;
                gap: 6px;
                letter-spacing: 1.5px;
            }
            .tagline {
                font-size: 1rem;
                margin-bottom: 30px;
            }
            .enter-button {
                padding: 14px 32px;
                font-size: 1rem;
            }
        }

        /* === KEYFRAMES / ANIMATIONS === */
        @keyframes zoomFadeIn {
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Background Interaktif: Garis & Node Modern -->
    <canvas id="networkCanvas" aria-hidden="true"></canvas>

    <!-- Layer Konten Utama -->
    <main class="content-wrapper" aria-labelledby="site-title">
        <!-- Logo -->
        <img src="logo.png" alt="SYNEXA - SAP Web Development" class="logo-img" width="500" decoding="async" fetchpriority="high">
        
        <!-- Akronim -->
        <div class="acronym-tag">
            <span>SYSTEM</span> <span class="dot">•</span>
            <span>NETWORK</span> <span class="dot">•</span>
            <span>EXCELLENCE</span> <span class="dot">•</span>
            <span>AUTOMATION</span>
        </div>

        <!-- Tagline -->
        <h1 id="site-title" class="tagline">
            Transforming Business<br>Through Smart Technology
        </h1>

        <!-- TOMBOL ENTER -->
        <a href="home.html" class="enter-button">ENTER DASHBOARD</a>
    </main>

    <!-- Script Animasi Interaktif -->
    <script>
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');
        let particlesArray;
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.floor(window.innerWidth * dpr);
            canvas.height = Math.floor(window.innerHeight * dpr);
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        resizeCanvas();

        let mouse = {
            x: null,
            y: null,
            radius: (canvas.height / 80) * (canvas.width / 80)
        };

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        // Touch support untuk smartphone
        window.addEventListener('touchmove', function(event) {
            mouse.x = event.touches[0].clientX;
            mouse.y = event.touches[0].clientY;
        });

        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = 'rgba(14, 165, 233, 0.4)'; 
                ctx.fill();
            }
            update() {
                if (this.x > canvas.width || this.x < 0) {
                    this.directionX = -this.directionX;
                }
                if (this.y > canvas.height || this.y < 0) {
                    this.directionY = -this.directionY;
                }

                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                
                if (distance < mouse.radius + this.size) {
                    if (mouse.x < this.x && this.x < canvas.width - this.size * 10) {
                        this.x += 5;
                    }
                    if (mouse.x > this.x && this.x > this.size * 10) {
                        this.x -= 5;
                    }
                    if (mouse.y < this.y && this.y < canvas.height - this.size * 10) {
                        this.y += 5;
                    }
                    if (mouse.y > this.y && this.y > this.size * 10) {
                        this.y -= 5;
                    }
                }
                this.x += this.directionX;
                this.y += this.directionY;
                this.draw();
            }
        }

        function init() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 10000;
            
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 2) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 1) - 0.5;
                let directionY = (Math.random() * 1) - 0.5;
                let color = 'rgba(14, 165, 233, 0.4)';

                particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) + 
                                   ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    
                    if (distance < (canvas.width / 7) * (canvas.height / 7)) {
                        opacityValue = 1 - (distance / 20000);
                        ctx.strokeStyle = 'rgba(148, 163, 184,' + (opacityValue * 0.5) + ')';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, innerWidth, innerHeight);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connect();
        }

        window.addEventListener('resize', function() {
            resizeCanvas();
            mouse.radius = ((innerHeight / 80) * (innerWidth / 80));
            init();
        });
        
        window.addEventListener('mouseout', function(){
            mouse.x = undefined;
            mouse.y = undefined;
        });

        init();
        if (prefersReducedMotion) {
            ctx.clearRect(0, 0, innerWidth, innerHeight);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].draw();
            }
        } else {
            animate();
        }
    </script>
</body>
</html>
